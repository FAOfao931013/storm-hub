version: '3.8'
name: storm-hub

services:
  storm-hub-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: storm-hub-api
    restart: unless-stopped
    
    # Bind to localhost only so Nginx can proxy from host
    ports:
      - "127.0.0.1:3000:3000"
    
    # Environment file (copy from .env.example on first deploy)
    env_file:
      - .env
    
    # Override HOST to listen on all interfaces inside container
    environment:
      - HOST=0.0.0.0
    
    # Persist SQLite database
    volumes:
      - sqlite-data:/app/data
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  sqlite-data:
    driver: local
