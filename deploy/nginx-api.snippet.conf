# Nginx configuration snippet for storm-hub API
# Add this location block to your existing api.fao13578.cn server block
#
# Example usage:
#   sudo nano /etc/nginx/sites-available/api.fao13578.cn
#   
#   server {
#       listen 443 ssl http2;
#       server_name api.fao13578.cn;
#       
#       # ... existing SSL config and /openApi/ location ...
#       
#       # ADD THIS BLOCK:
#       include /opt/storm-hub/deploy/nginx-api.snippet.conf;
#   }
#
#   sudo nginx -t && sudo systemctl reload nginx

location /api/ {
    # Proxy to Docker container on localhost:3000
    proxy_pass http://127.0.0.1:3000;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Disable buffering for real-time responses (optional)
    # proxy_buffering off;
}
